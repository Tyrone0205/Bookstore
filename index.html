<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DA Bookstore</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <script src="./scripts/db.js" defer></script>
</head>

<body onload="renderBooks()">
    <header>
        <div class="content-container header-content">
            <img src="./assets/icons/website_icon.png" alt="DA Bookstore Logo">
            <h1>DA Bookstore</h1>
            <span>- get your book here</span>
        </div>
    </header>

    <main>
        <div id="book-collection" class="content-container book-container">

        </div>
    </main>

    <footer>
        <div class="content-container footer-content">
            <p>© 2026 DA Bookstore</p>
        </div>
    </footer>


    <dialog id="username-dialog" class="username-dialog">
        <form id="username-form" class="username-form">
            <h2>Willkommen im Bookstore!</h2>

            <p>Wie dürfen wir dich nennen?</p>

            <input type="text" id="username-input" placeholder="Dein Benutzername ..." maxlength="25" required>

            <div class="username-buttons">
                <button type="button" onclick="closeUsernameDialog()">
                    Abbrechen
                </button>

                <button type="submit">
                    Speichern & kommentieren
                </button>
            </div>
        </form>
    </dialog>

</body>

</html>
