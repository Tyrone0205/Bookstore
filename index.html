<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DA Bookstore</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./assets/icons/website_icon.png" type="image/png">
    <script src="./script.js" defer></script>
    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/template.js"></script>
</head>

<body onload="init()">
    <header>
        <div class="content-container header-content">
            <img src="./assets/icons/website_icon.png" alt="DA Bookstore Logo">
            <h1>DA Bookstore</h1>
            <span>- get your book here</span>
        </div>
    </header>

    <main>

        <div class="book-filters" role="group" aria-label="Bücher filtern">
            <button id="filter-all" type="button" aria-pressed="true" onclick="setBookFilter(false)">
                Alle Bücher
            </button>

            <button id="filter-liked" type="button" aria-pressed="false" onclick="setBookFilter(true)">
                ♥ Gelikte Bücher
            </button>
        </div>

        <div id="book-collection" class="content-container book-container">

        </div>
    </main>

    <footer>
        <div class="content-container footer-content">
            <p>© 2026 DA Bookstore</p>
        </div>
    </footer>

    <!-- Dialog zur einmaligen Eingabe des Benutzernamens -->
    <dialog id="username-dialog" class="username-dialog" aria-labelledby="username-dialog-title"
        onclick="closeUsernameDialogOutside(event)">

        <form id="username-form" class="username-form" onsubmit="saveUsername(event)">

            <h2 id="username-dialog-title">
                Willkommen im Bookstore!
            </h2>

            <label for="username-input">
                Wie dürfen wir dich nennen?
            </label>

            <input type="text" id="username-input" name="username" placeholder="Dein Benutzername ..."
                autocomplete="nickname" maxlength="25" required>

            <div class="username-buttons">
                <button type="button" onclick="closeUsernameDialog()">
                    Abbrechen
                </button>

                <button type="submit">
                    Speichern & kommentieren
                </button>
            </div>

        </form>
    </dialog>


</body>

</html>
